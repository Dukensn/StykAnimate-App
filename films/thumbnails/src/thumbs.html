<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Lilita One"; src: url("LilitaOne.ttf"); }
@font-face { font-family: "Comic Neue"; font-weight: 700; src: url("../../little-bean/assets/fonts/ComicNeue-Bold.ttf"); }
@font-face { font-family: "Caveat"; font-weight: 400 700; src: url("../../little-bean/assets/fonts/Caveat.ttf"); }
@font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../someday/assets/fonts/Inter.ttf"); }
html,body{margin:0;background:#000} canvas{display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../../little-bean/assets/js/core.js"></script>
<script src="../../little-bean/assets/js/chars.js"></script>
<script src="../../little-bean/assets/js/props.js"></script>
<script src="../../little-bean/assets/js/fx.js"></script>
<script src="../../little-bean/assets/js/sets2.js"></script>
<script src="../../little-bean/assets/js/sets3.js"></script>
<script src="../../someday/assets/js/sil.js"></script>
<script src="../../someday/assets/js/flat.js"></script>
<script src="thumbs.js"></script>
<script>
const W = 1920, H = 1080;
function setup() { const ctx = document.getElementById('c').getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); F.G.t = 1.3; F.G.boil = 2; F.G.frame = 7; return ctx; }
function vignette(ctx, a = 0.6) { const g = ctx.createRadialGradient(W/2, H/2, 380, W/2, H/2, 1150); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0,0,W,H); }

window.T = {
  unsent() {
    const ctx = setup();
    TH.blurLayer(ctx, W, H, 10, (b) => { b.save(); b.translate(960,540); b.scale(1.6,1.6); b.translate(-620,-560); Pr.theoRoom(b, { clock: '3:17', lamp: 0, dark: 0.35 }); b.restore(); });
    ctx.fillStyle = 'rgba(5,6,12,0.55)'; ctx.fillRect(0,0,W,H);
    TH.glow(ctx, 1500, 560, 700, 'rgba(255,170,60,0.25)');
    // Pride looming behind
    C.drawPride(ctx, 1700, 1640, { s: 3.3, grin: 1.5, look: -26, angry: true });
    // Theo
    TH.torso(ctx, 1260, 560, 300, '#3b3f48');
    TH.hero(ctx, 1260, 560, 300, { kind: 'theo', eyes: 'teary', look: [-0.8, 0.7], brow: 1, mouth: 'wobble', tears: 0.9, sweat: true, blush: 0.3,
      key: { x: -0.6, y: 1.0, col: 'rgba(120,170,255,0.75)' }, rim: { col: '#ffb13d', side: 1 } });
    // the phone
    TH.glow(ctx, 560, 760, 520, 'rgba(110,160,255,0.45)');
    Pr.phone(ctx, 540, 500, 0.95, -0.1, { msgs: [{ who: 'me', text: "stop telling me what i can't do." }, { who: 'mom', text: 'just tell me you ate.' }], header: 'Mom', status: 'online', input: 'hi mom', caret: true, kb: false, sendHot: 1, clock: '3:17' });
    TH.grip(ctx, 290, 900, 1.4, -0.1, 1); TH.grip(ctx, 800, 860, 1.4, -0.1, -1);
    TH.title(ctx, [[{ t: '214 ', c: '#ffb13d' }, { t: 'DRAFTS.' }]], 60, 230, 230);
    vignette(ctx, 0.5);
  },
  again() {
    const ctx = setup();
    TH.blurLayer(ctx, W, H, 12, (b) => { b.save(); b.translate(960,540); b.scale(1.3,1.3); b.translate(-960,-520); S2.park(b, { season: 'winter' }); b.restore(); });
    ctx.fillStyle = 'rgba(8,10,20,0.5)'; ctx.fillRect(0,0,W,H);
    TH.glow(ctx, 560, 600, 600, 'rgba(200,215,255,0.22)');
    // Mae (blank) with Forgetting's hands reaching for her eyes
    TH.torso(ctx, 560, 640, 270, '#8f7aa6', { scarf: '#8a2f35' });
    TH.hero(ctx, 560, 640, 270, { kind: 'mae', eyes: 'blank', look: [0.2, 0], brow: 0.1, mouth: 'flat', key: { x: -0.4, y: -0.6, col: 'rgba(210,225,255,0.45)' }, rim: { col: '#cfd8f2', side: -1 } });
    ctx.save(); ctx.shadowColor = '#d6def5'; ctx.shadowBlur = 30;
    for (const sd of [-1, 1]) {
      ctx.save(); ctx.translate(560 + sd * 110, 640); ctx.rotate(sd * 0.25);
      ctx.fillStyle = 'rgba(232,238,252,0.78)'; ctx.strokeStyle = 'rgba(245,248,255,0.95)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(sd * 40, 10, 78, 62, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.roundRect(-sd * 30 - (sd > 0 ? 130 : 0), -40 + k * 30, 130, 26, 13); ctx.fill(); ctx.stroke(); }
      ctx.restore();
    }
    ctx.restore();
    // Leo crying
    TH.torso(ctx, 1400, 600, 300, '#6b5a48', { scarf: '#3d4a5a' });
    TH.hero(ctx, 1400, 600, 300, { kind: 'leo', eyes: 'teary', look: [-0.8, 0.1], brow: 1, mouth: 'cry', tears: 1, blush: 0.4, key: { x: 0.5, y: -0.6, col: 'rgba(255,220,170,0.35)' }, rim: { col: '#ff5a55', side: 1 } });
    S2.thread(ctx, [760, 1010], [1180, 1000], 1, 60, { w: 10, glow: 30 });
    S2.petals(ctx, 90, 'rgba(240,244,250,0.95)', { snow: true, seed: 3 });
    TH.title(ctx, [[{ t: 'WHO ARE ' }, { t: 'YOU?', c: '#ff4d4a' }]], 60, 230, 230);
    vignette(ctx, 0.5);
  },
  bean() {
    const ctx = setup();
    TH.blurLayer(ctx, W, H, 12, (b) => { b.save(); b.translate(960,540); b.scale(1.4,1.4); b.translate(-900,-540); Pr.kitchen(b, { mode: 'night', lamp: 1 }); b.restore(); });
    ctx.fillStyle = 'rgba(10,8,6,0.45)'; ctx.fillRect(0,0,W,H);
    TH.glow(ctx, 1300, 300, 800, 'rgba(255,200,130,0.35)');
    TH.torso(ctx, 1380, 600, 300, '#3e4f66');
    TH.hero(ctx, 1380, 600, 300, { kind: 'dad', eyes: 'teary', look: [-0.8, 0.5], brow: 1, mouth: 'cry', tears: 1, blush: 0.45, key: { x: -0.3, y: -0.9, col: 'rgba(255,215,160,0.45)' }, rim: { col: '#ffd54a', side: 1 } });
    // the note, held up close
    TH.glow(ctx, 640, 700, 520, 'rgba(255,230,180,0.35)');
    S3.note(ctx, 640, 700, 860, 560, -0.08, ['have a great day,', 'old bean.', 'i kept every one.'], { size: 92, ink: '#5a3a8a', doodle: 'dad' });
    TH.grip(ctx, 240, 760, 1.4, -0.1, 1); TH.grip(ctx, 1050, 700, 1.4, -0.1, -1);
    S3.lunchbox(ctx, 1760, 1060, 1.6, { open: 1 });
    TH.title(ctx, [[{ t: '4,512 ', c: '#ffd54a' }, { t: 'NOTES.' }]], 60, 230, 230);
    vignette(ctx, 0.45);
  },
  someday() {
    const ctx = setup();
    TH.blurLayer(ctx, W, H, 6, (b) => { b.save(); b.translate(960,540); b.scale(1.15,1.15); b.translate(-960,-600); FLAT.beach(b); b.restore(); });
    const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0, 'rgba(255,150,70,0.25)'); g.addColorStop(1, 'rgba(255,110,50,0.05)'); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    TH.glow(ctx, 1560, 470, 760, 'rgba(255,240,200,1)');
    TH.glow(ctx, 1560, 470, 260, 'rgba(255,255,240,1)');
    // son standing beside, hand on dad's shoulder
    SIL.sil(ctx, { kind: 'noah', x: 1300, y: 1330, s: 2.6, face: -0.5, armL: [-1.45, -0.2], armR: [-0.1, -0.1], e: { eyes: 'happy', look: [-0.6, 0], smile: true }, noBlink: true, noShadow: true });
    // dad close-up
    SIL.close(ctx, 700, 640, 260, { eyes: 'teary', look: [0.8, -0.3], brow: 0.8, browUp: 0.8, smile: true, tear: 1 }, { cap: true, seed: 5, noBlink: true });
    ctx.save(); ctx.shadowColor = '#ffb46a'; ctx.shadowBlur = 40; ctx.strokeStyle = 'rgba(255,190,120,0.9)'; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(700, 640, 262, -1.3, 0.7); ctx.stroke(); ctx.restore();
    TH.title(ctx, [[{ t: 'SOME' }, { t: 'DAY.', c: '#ffd34d' }]], 60, 230, 240);
    vignette(ctx, 0.4);
  },
};
</script></body></html>
