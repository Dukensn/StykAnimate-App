<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>UNSENT.</title>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Comic Neue"; font-weight: 700; src: url("assets/fonts/ComicNeue-Bold.ttf"); }
      @font-face { font-family: "Comic Neue"; font-weight: 400; src: url("assets/fonts/ComicNeue-Regular.ttf"); }
      @font-face { font-family: "Caveat"; font-weight: 400 700; src: url("assets/fonts/Caveat.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #film { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      /* keeps the faces resolvable before the canvas draws */
      .font-warm { position: absolute; left: -9999px; font-family: "Comic Neue", "Caveat"; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="246" data-width="1920" data-height="1080">
      <canvas id="film" class="clip" width="1920" height="1080" data-start="0" data-duration="246" data-track-index="0" data-track-kind="graphics" data-layout-ignore></canvas>
      <audio id="score" class="clip" src="assets/audio/mix.wav" data-start="0" data-duration="246" data-track-index="1" data-volume="1"></audio>
      <span class="font-warm">Aa <span style="font-family: Caveat">Aa</span></span>
    </div>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/chars.js"></script>
    <script src="assets/js/props.js"></script>
    <script src="assets/js/fx.js"></script>
    <script src="assets/js/film.js"></script>
    <script>
      (function () {
        const canvas = document.getElementById("film");
        const ctx = canvas.getContext("2d");
        let last = 0;
        function renderAt(t) { last = t; FILM.renderAt(ctx, t); }
        window.__renderAt = renderAt;
        const fontsReady = Promise.all([
          document.fonts.load('700 40px "Comic Neue"'),
          document.fonts.load('400 40px "Comic Neue"'),
          document.fonts.load('600 40px "Caveat"'),
        ]).then(() => renderAt(last));
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["fonts"] = fontsReady;
        window.addEventListener("hf-seek", (e) => {
          renderAt(e.detail.time);
          if (e.detail.waitUntil) e.detail.waitUntil(fontsReady);
        });
        renderAt(0);
        const tl = gsap.timeline({ paused: true });
        tl.set({}, {}, 246);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
